AWSTemplateFormatVersion: "2010-09-09"
Description: Tabla DynamoDB para franchise-api (diseno de tabla unica pk/sk)

Parameters:
  TableName:
    Type: String
    Default: franchises

Resources:
  FranchisesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  TableName:
    Value: !Ref FranchisesTable
  TableArn:
    Value: !GetAtt FranchisesTable.Arn
